<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>식단 사진 → 칼로리 분석</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: #0f172a; color: #e2e8f0; }
.container { max-width: 800px; margin: 0 auto; padding: 20px; }
h1 { font-size: 1.5rem; margin-bottom: 8px; }
.subtitle { color: #94a3b8; margin-bottom: 24px; font-size: 0.9rem; }
.nav { display: flex; gap: 16px; justify-content: center; margin-bottom: 24px; }
.nav a { padding: 6px 16px; border-radius: 6px; background: #1e293b; color: #94a3b8; font-size: 0.85rem; text-decoration: none; }
.nav a.active { background: #3b82f6; color: #fff; }
.main-card { background: #1e293b; border-radius: 12px; padding: 24px; border: 1px solid #334155; margin-bottom: 20px; }
.row { display: flex; gap: 20px; flex-wrap: wrap; align-items: flex-start; }
.photo-area { flex: 1; min-width: 240px; }
.photo-box { border: 2px dashed #475569; border-radius: 10px; height: 240px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all .2s; background-size: cover; background-position: center; position: relative; }
.photo-box:hover { border-color: #60a5fa; background: #1e293b; }
.photo-box.has-photo { border-style: solid; border-color: #334155; }
.photo-box .hint { text-align: center; color: #64748b; }
.photo-box .hint svg { width: 40px; height: 40px; margin-bottom: 8px; stroke: #64748b; fill: none; stroke-width: 1.5; }
.photo-box input { display: none; }
.photo-box .remove-btn { position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.6); color: #fff; border: none; border-radius: 50%; width: 28px; height: 28px; cursor: pointer; display: none; }
.photo-box.has-photo .remove-btn { display: flex; align-items: center; justify-content: center; }
.input-area { flex: 1; min-width: 200px; }
.input-area label { display: block; font-size: 0.85rem; color: #94a3b8; margin-bottom: 6px; }
.input-area input[type="text"] { width: 100%; padding: 10px 14px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #e2e8f0; font-size: 1rem; margin-bottom: 12px; }
.input-area input[type="text"]:focus { outline: none; border-color: #3b82f6; }
.suggestions { background: #0f172a; border: 1px solid #334155; border-radius: 8px; max-height: 180px; overflow-y: auto; display: none; position: absolute; width: calc(100% - 2px); z-index: 10; }
.suggestions div { padding: 8px 14px; cursor: pointer; font-size: 0.9rem; }
.suggestions div:hover { background: #1e293b; }
.suggestions .active { background: #1e293b; }
.input-wrap { position: relative; }
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 24px; border: none; border-radius: 8px; font-size: 1rem; cursor: pointer; transition: all .2s; }
.btn-primary { background: #3b82f6; color: #fff; }
.btn-primary:hover { background: #2563eb; }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-secondary { background: #334155; color: #e2e8f0; }
.btn-secondary:hover { background: #475569; }
.btn-sm { padding: 6px 14px; font-size: 0.85rem; }
.actions { margin-top: 16px; display: flex; gap: 8px; flex-wrap: wrap; }

/* Result */
.result { display: none; }
.result.show { display: block; }
.result-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid #334155; }
.result-header .title { font-size: 1.1rem; font-weight: 700; }
.result-header .cal { font-size: 1.5rem; font-weight: 800; color: #22c55e; }
.nutrition-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 10px; }
.nutrition-item { background: #0f172a; border-radius: 8px; padding: 12px; text-align: center; }
.nutrition-item .val { font-size: 1.1rem; font-weight: 700; }
.nutrition-item .lbl { font-size: 0.75rem; color: #64748b; margin-top: 2px; }
.nutrition-item .protein { color: #f97316; }
.nutrition-item .fat { color: #eab308; }
.nutrition-item .carbs { color: #22c55e; }
.nutrition-item .fiber { color: #a855f7; }
.nutrition-item .sugar { color: #ef4444; }
.meal-total { margin-top: 20px; padding: 16px; background: #0f172a; border-radius: 10px; }
.meal-total h3 { font-size: 0.9rem; color: #94a3b8; margin-bottom: 8px; }
.meal-total .totals { display: flex; gap: 24px; flex-wrap: wrap; }
.meal-total .totals > div { text-align: center; }
.meal-total .totals .v { font-size: 1.3rem; font-weight: 700; }
.meal-total .totals .l { font-size: 0.75rem; color: #64748b; }

.added-foods { margin-top: 12px; }
.added-food { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: #0f172a; border-radius: 6px; margin-bottom: 6px; font-size: 0.9rem; }
.added-food .name { display: flex; align-items: center; gap: 8px; }
.added-food .remove { color: #ef4444; cursor: pointer; font-size: 0.8rem; padding: 2px 6px; border-radius: 4px; }
.added-food .remove:hover { background: #450a0a; }

.history { margin-top: 24px; }
.history h2 { font-size: 1.1rem; margin-bottom: 12px; color: #94a3b8; }
.history-entry { display: flex; justify-content: space-between; padding: 8px 12px; border-bottom: 1px solid #1e293b; font-size: 0.85rem; }
.history-entry .time { color: #64748b; }
.history-entry .cals { color: #22c55e; font-weight: 600; }
.history-empty { color: #64748b; font-size: 0.85rem; text-align: center; padding: 20px; }
</style>
</head>

<div class="container">

            <svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>

      </div>
      <div class="input-area">

          <option value="2">2 인분 (2x)</option>
          <option value="3">3 인분 (3x)</option>
        </select>
        <div class="actions">
          <button class="btn btn-primary" id="btn-add">식단에 추가</button>
          <button class="btn btn-secondary btn-sm" id="btn-ai" title="AI 자동 인식 (Hugging Face)">🤖 AI 인식</button>
        </div>
      </div>
    </div>
  </div>

  <div class="main-card">
    <h2 style="font-size:1rem;margin-bottom:12px;color:#94a3b8;">오늘 먹은 음식</h2>
    <div id="added-foods">

    </div>
    <div class="meal-total" id="meal-total" style="display:none;">
      <h3>총 영양소</h3>
      <div class="totals">

        <div><div class="v" id="total-protein" style="color:#f97316">0</div><div class="l">단백질(g)</div></div>
        <div><div class="v" id="total-fat" style="color:#eab308">0</div><div class="l">지방(g)</div></div>
        <div><div class="v" id="total-carbs" style="color:#22c55e">0</div><div class="l">탄수화물(g)</div></div>
        <div><div class="v" id="total-fiber" style="color:#a855f7">0</div><div class="l">식이섬유(g)</div></div>
      </div>
    </div>
  </div>

  <div class="main-card history">
    <h2>📋 저장된 식단 기록</h2>
    <div id="history-list"><div class="history-empty">아직 기록이 없습니다</div></div>
  </div>
</div>

FOOD_DB.sort((a,b) => a.name.localeCompare(b.name));

// ── State ──
let addedFoods = []; // { name, cal, protein, fat, carbs, fiber, sugar, serving }
let history = JSON.parse(localStorage.getItem('food_history') || '[]');
let selectedFood = null;
let photoDataURL = null;

const foodInput = document.getElementById('food-input');
const suggestions = document.getElementById('suggestions');
const servingInput = document.getElementById('serving-input');
const btnAdd = document.getElementById('btn-add');
const btnAI = document.getElementById('btn-ai');
const photoInput = document.getElementById('photo-input');
const photoBox = document.getElementById('photo-box');
const photoHint = document.getElementById('photo-hint');
const removePhotoBtn = document.getElementById('remove-photo');
const addedFoodsEl = document.getElementById('added-foods');
const mealTotal = document.getElementById('meal-total');

// ── Autocomplete ──
foodInput.addEventListener('input', () => {
  const q = foodInput.value.trim().toLowerCase();
  if (!q) { suggestions.style.display = 'none'; selectedFood = null; return; }
  const matches = FOOD_DB.filter(f => f.name.includes(q)).slice(0, 10);
  if (!matches.length) { suggestions.style.display = 'none'; return; }
  suggestions.innerHTML = matches.map(f => `<div data-name="${f.name}">${f.name} <span style="color:#64748b;font-size:0.8rem">${f.cal}kcal / ${f.unit}</span></div>`).join('');
  suggestions.style.display = 'block';
  suggestions.querySelectorAll('div').forEach(el => {
    el.addEventListener('click', () => {
      selectFood(el.dataset.name);
    });
  });
});

foodInput.addEventListener('blur', () => setTimeout(() => suggestions.style.display = 'none', 200));
foodInput.addEventListener('focus', () => { if (foodInput.value) foodInput.dispatchEvent(new Event('input')); });

function selectFood(name) {
  foodInput.value = name;
  selectedFood = FOOD_DB.find(f => f.name === name) || null;
  suggestions.style.display = 'none';
}

// ── Photo ──
photoInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    photoDataURL = ev.target.result;
    photoBox.style.backgroundImage = `url(${photoDataURL})`;
    photoBox.classList.add('has-photo');
    photoHint.style.display = 'none';
  };
  reader.readAsDataURL(file);
});

function removePhoto() {
  photoDataURL = null;
  photoInput.value = '';
  photoBox.style.backgroundImage = '';
  photoBox.classList.remove('has-photo');
  photoHint.style.display = 'block';
}

// ── Add food ──
btnAdd.addEventListener('click', () => {
  if (!selectedFood) {
    if (!foodInput.value.trim()) return alert('음식 이름을 입력하세요');
    // partial match
    const match = FOOD_DB.find(f => f.name === foodInput.value.trim());
    if (!match) return alert(`"${foodInput.value.trim()}" 을(를) DB에서 찾을 수 없습니다`);
    selectedFood = match;
  }
  const serving = parseFloat(servingInput.value);
  const food = {
    name: selectedFood.name,
    cal: Math.round(selectedFood.cal * serving),
    protein: Math.round(selectedFood.protein * serving * 10) / 10,
    fat: Math.round(selectedFood.fat * serving * 10) / 10,
    carbs: Math.round(selectedFood.carbs * serving * 10) / 10,
    fiber: Math.round(selectedFood.fiber * serving * 10) / 10,
    sugar: Math.round(selectedFood.sugar * serving * 10) / 10,
    serving
  };
  addedFoods.push(food);
  renderAddedFoods();
  foodInput.value = '';
  selectedFood = null;
  suggestions.style.display = 'none';
});

function renderAddedFoods() {
  if (!addedFoods.length) {
    addedFoodsEl.innerHTML = '<div class="history-empty">음식을 추가해주세요</div>';
    mealTotal.style.display = 'none';
    return;
  }
  mealTotal.style.display = 'block';
  addedFoodsEl.innerHTML = addedFoods.map((f, i) => `
    <div class="added-food">
      <div class="name">${f.name} <span style="color:#64748b;font-size:0.8rem">(${f.serving}x)</span></div>
      <div><span style="color:#22c55e">${f.cal}kcal</span> <span class="remove" onclick="removeFood(${i})">삭제</span></div>
    </div>
  `).join('');

  const sums = addedFoods.reduce((a, f) => ({
    cal: a.cal + f.cal,
    protein: a.protein + f.protein,
    fat: a.fat + f.fat,
    carbs: a.carbs + f.carbs,
    fiber: a.fiber + f.fiber
  }), { cal:0, protein:0, fat:0, carbs:0, fiber:0 });

  document.getElementById('total-cal').textContent = sums.cal;
  document.getElementById('total-protein').textContent = Math.round(sums.protein * 10) / 10;
  document.getElementById('total-fat').textContent = Math.round(sums.fat * 10) / 10;
  document.getElementById('total-carbs').textContent = Math.round(sums.carbs * 10) / 10;
  document.getElementById('total-fiber').textContent = Math.round(sums.fiber * 10) / 10;
}

function removeFood(i) {
  addedFoods.splice(i, 1);
  renderAddedFoods();
}

// ── Save meal ──
function saveMeal() {
  if (!addedFoods.length) return;
  const sums = addedFoods.reduce((a, f) => ({
    cal: a.cal + f.cal, protein: a.protein + f.protein,
    fat: a.fat + f.fat, carbs: a.carbs + f.carbs
  }), { cal:0, protein:0, fat:0, carbs:0 });
  const entry = {
    time: new Date().toISOString(),
    foods: [...addedFoods],
    totalCal: sums.cal, totalProtein: sums.protein, totalFat: sums.fat, totalCarbs: sums.carbs
  };
  history.unshift(entry);
  if (history.length > 100) history = history.slice(0, 100);
  localStorage.setItem('food_history', JSON.stringify(history));
  renderHistory();
}

// ── History ──
function renderHistory() {
  const el = document.getElementById('history-list');
  if (!history.length) { el.innerHTML = '<div class="history-empty">아직 기록이 없습니다</div>'; return; }
  el.innerHTML = history.map(h => `
    <div class="history-entry">
      <div><span class="time">${new Date(h.time).toLocaleString('ko-KR', { month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' })}</span> ${h.foods.map(f => f.name).join(', ')}</div>
      <div class="cals">${h.totalCal}kcal</div>
    </div>
  `).join('');
}
renderHistory();

// ── AI auto-detect (Hugging Face free inference) ──
btnAI.addEventListener('click', async () => {
  if (!photoDataURL) return alert('먼저 사진을 업로드하세요');
  btnAI.disabled = true;
  btnAI.textContent = '분석 중...';

  // Convert base64 to blob
  const res = await fetch(photoDataURL);
  const blob = await res.blob();

  try {
    // Use Hugging Face free inference API with nateraw/food model
    const hfRes = await fetch('https://api-inference.huggingface.co/models/nateraw/food', {
      method: 'POST',
      headers: { 'Content-Type': 'application/octet-stream' },
      body: blob
    });
    if (!hfRes.ok) throw new Error(`API error ${hfRes.status}: ${await hfRes.text()}`);
    const data = await hfRes.json();
    if (!data.length) throw new Error('No results');
    const top = data[0];
    const label = top.label.replace(/_/g, ' ');
    const score = (top.score * 100).toFixed(1);
    foodInput.value = label;
    selectedFood = null; // force partial match
    const match = FOOD_DB.find(f => f.name.includes(label.split(' ')[0]));
    if (match) {
      selectedFood = match;
      foodInput.value = match.name;
    } else {
      // Try closest match
      const words = label.toLowerCase().split(' ');
      const best = FOOD_DB.reduce((a, f) => {
        const score = words.filter(w => f.name.includes(w)).length;
        return score > a.score ? { f, score } : a;
      }, { f: null, score: 0 });
      if (best.f && best.score > 0) {
        selectedFood = best.f;
        foodInput.value = best.f.name;
      }
    }
    alert(`AI 추정: ${label} (${score}%)\n가장 가까운 DB 음식: ${foodInput.value}`);
  } catch (e) {
    alert(`AI 인식 실패: ${e.message}\n직접 음식 이름을 입력해주세요`);
  }
  btnAI.disabled = false;
  btnAI.textContent = '🤖 AI 인식';
});

// ── Keyboard shortcut ──
foodInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && selectedFood) btnAdd.click();
});

// ── Save on unload ──
if (addedFoods.length) saveMeal();
// Also save periodically
setInterval(() => { if (addedFoods.length) saveMeal(); }, 30000);
</script>
